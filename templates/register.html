<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOGRA — Register</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-shell">
      <img class="brand-logo" src="/static/SOGRA.svg" alt="SOGRA logo">

      <h1>Register</h1>

      <form class="auth-card" action="/register" method="POST">
        <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
        {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
        <div class="field">
          <label for="phone">Phone number *</label>
          <input id="phone" name="phone" type="tel" placeholder="+33 6 12 34 56 78" autocomplete="tel" maxlength="30" value="{{ request.form.get('phone', '') }}" required>
        </div>

        <div class="field">
          <label for="city">City *</label>
          <input id="city" name="city" type="text" placeholder="Paris" autocomplete="address-level2" maxlength="100" value="{{ request.form.get('city', '') }}" required>
        </div>

        <div class="field">
          <label for="recovery-email">Recovery email (optional)</label>
          <input id="recovery-email" name="recovery_email" type="email" placeholder="you@example.com" autocomplete="email" aria-describedby="recovery-help" maxlength="254" value="{{ request.form.get('recovery_email', '') }}">
          <p id="recovery-help" class="field-help">Used only if you lose access to your phone number. Never used for marketing.</p>
        </div>

        <button type="submit">Send code</button>
      </form>

      <p class="switch-page">Already a member? <a href="/login">Login</a></p>

      <p class="legal">
        By continuing, you agree to our
        <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
      </p>
    </section>
  </main>
</body>
</html>

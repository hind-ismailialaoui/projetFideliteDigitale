<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOGRA — Login</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-shell">
      <img class="brand-logo" src="/static/SOGRA.svg" alt="SOGRA logo">

      <h1>Login</h1>

      <form class="auth-card">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="At least 8 characters" autocomplete="current-password" minlength="8" required>
        </div>

        <div class="form-link-row">
          <a href="reset_password.html">Forgot password?</a>
        </div>

        <button type="submit">Login</button>
      </form>

      <p class="switch-page">New here? <a href="register.html">Register</a></p>

      <p class="legal">
        By continuing, you agree to our
        <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
      </p>
    </section>
  </main>
</body>
</html>

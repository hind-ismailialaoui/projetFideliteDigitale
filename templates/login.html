<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOGRA — Login</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-shell">
      <img class="brand-logo" src="/static/SOGRA.svg" alt="SOGRA logo">

      <h1>Login</h1>

      <form class="auth-card" action="/login" method="POST">
        <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
        {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
        <div class="field">
          <label for="phone">Phone number</label>
          <input id="phone" name="phone" type="tel" placeholder="+33 6 12 34 56 78" autocomplete="tel" maxlength="30" value="{{ request.form.get('phone', '') }}" required>
        </div>

        <div class="form-link-row">
          <a href="/account-recovery">Account recovery</a>
        </div>

        <button type="submit">Send code</button>
      </form>

      <p class="switch-page">New here? <a href="/register">Register</a></p>

      <p class="legal">
        By continuing, you agree to our
        <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
      </p>
    </section>
  </main>
</body>
</html>
